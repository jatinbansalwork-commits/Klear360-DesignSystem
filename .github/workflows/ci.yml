name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: yarn tsc:klear360

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: yarn lint

  test-web:
    name: Test (web)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: yarn workspace @klear/klear360 test:react

  test-native:
    name: Test (native)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: yarn workspace @klear/klear360 test:react-native

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: yarn workspace @klear/klear360 build
      - run: yarn workspace @klear/klear360 verify:interop

  chromatic:
    name: Chromatic
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
      - run: yarn install --frozen-lockfile
      - uses: chromaui/action@v1
        with:
          projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
          workingDir: packages/klear360
          buildScriptName: react:storybook:build
          exitZeroOnChanges: true

  bundle-size:
    name: Bundle Size
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: yarn workspace @klear/klear360 pregenerate-bundle-size-info
      - run: yarn workspace @klear/klear360 generate-bundle-size-info
      - run: node scripts/writeBundleSizeDiffTable.js
        working-directory: packages/klear360
      - name: Comment bundle size diff on PR
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const diffTable = fs
              .readFileSync('packages/klear360/bundleSizeDiff.md', 'utf8')
              .trim();
            const marker = '<!-- bundle-size-diff -->';
            const body = diffTable
              ? `${marker}\n### 📦 Bundle Size Diff\n${diffTable}`
              : `${marker}\n### 📦 Bundle Size Diff\nNo bundle size changes detected.`;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find((comment) => comment.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

  update-bundle-size-baseline:
    name: Update Bundle Size Baseline
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: yarn workspace @klear/klear360 pregenerate-bundle-size-info
      - run: yarn workspace @klear/klear360 generate-bundle-size-info
        env:
          BUNDLE_SIZE_STATS_FILENAME: baseBundleSizeStats.json
      - name: Publish baseline to bundle-size-stats branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          cp packages/klear360/baseBundleSizeStats.json /tmp/baseBundleSizeStats.json
          git clone --branch bundle-size-stats --single-branch \
            "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" \
            /tmp/bundle-size-stats-branch
          mkdir -p /tmp/bundle-size-stats-branch/packages/klear360
          cp /tmp/baseBundleSizeStats.json /tmp/bundle-size-stats-branch/packages/klear360/baseBundleSizeStats.json
          cd /tmp/bundle-size-stats-branch
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add packages/klear360/baseBundleSizeStats.json
          if git diff --cached --quiet; then
            echo "Bundle size baseline unchanged"
          else
            git commit -m "chore: update bundle size baseline [skip ci]"
            git push origin bundle-size-stats
          fi
